[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v_ase-gui"
version = "0.2.27"
description = "A local 3D viewer, editor, and analysis workspace for atomistic structures, trajectories, and DFT fields."
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
  { name = "v_ase contributors" }
]
keywords = [
  "ase",
  "atomistic-simulation",
  "materials-science",
  "molecular-visualization",
  "trajectory-analysis",
  "density-functional-theory",
  "scientific-visualization",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
  "ase>=3.23",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-image>=0.23",
  "plotly>=5.24",
  "matplotlib>=3.7",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10",
  "requests>=2.31",
]

[project.urls]
Homepage = "https://github.com/lgyEthan/v_ase"
Repository = "https://github.com/lgyEthan/v_ase"
Issues = "https://github.com/lgyEthan/v_ase/issues"

[project.scripts]
v_ase = "v_ase.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "playwright>=1.40",
  "build>=1.2",
  "twine>=5",
]
rhino = [
  "rhino3dm>=8.0",
]

[tool.setuptools.packages.find]
include = ["v_ase*"]

[tool.setuptools.package-data]
v_ase = [
  "skills_v_ase.md",
  "skills/visualizing-atomic-structures-with-v-ase/SKILL.md",
  "skills/visualizing-atomic-structures-with-v-ase/references/*.md",
  "skills/visualizing-atomic-structures-with-v-ase/agents/*.yaml",
  "static/*.html",
  "static/*.css",
  "static/*.js",
  "static/*.png",
  "static/vendor/*.js",
  "static/vendor/THREE_LICENSE",
]
