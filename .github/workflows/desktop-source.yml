name: Verify desktop source before publication

on:
  push:
    branches: ["fix/**", "feature/**", "release/**", "maintenance/**"]
    paths: ["v_ase/**", "desktop/**", ".github/workflows/desktop-source.yml"]
  pull_request:
    paths: ["v_ase/**", "desktop/**", ".github/workflows/desktop-source.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-source:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      V_ASE_SOFTWARE_GL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install this source candidate (never published as a desktop artifact)
        run: python -m pip install ".[mcp,rhino]"
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Verify native inputs, rendered selection and constraints, panel scrolling and DPI
        shell: pwsh
        run: |
          $env:VASE_DEV_PYTHON = (Get-Command python).Source
          npm run smoke
        working-directory: desktop
      - name: Keep source test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-source-windows
          path: desktop/smoke-output/
          retention-days: 14
