name: Build and verify desktop apps

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
          - runner: windows-2022
            platform: win-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare the verified scientific Python runtime
        run: python scripts/prepare_runtime.py
      - run: npm ci
      - name: Check native file permissions and atomic saves
        run: npm test
      - name: Exercise the desktop GUI and native commands
        run: npm run smoke
      - name: Build the installer and portable archive
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Test the packaged application and relocated Python
        run: python scripts/test_packaged.py
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks-${{ matrix.platform }}
          path: desktop/smoke-output/
          retention-days: 14
      - name: Stage desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-release-*
          path: desktop-assets
          merge-multiple: true
      - name: Publish only after every platform passes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          git archive --format=tar.gz --prefix="v_ase-desktop-${VERSION}/" HEAD > "desktop-assets/v_ase-desktop-${VERSION}-source.tar.gz"
          (cd desktop-assets && sha256sum * > desktop-SHA256SUMS.txt)
          gh release upload "$TAG" desktop-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > desktop-release-notes.md
          python - <<'PY'
          from pathlib import Path
          import os
          notes = Path('desktop-release-notes.md')
          text = notes.read_text().split('\n<!-- desktop-build -->')[0].rstrip()
          text += '\n\n<!-- desktop-build -->\n### macOS and Windows desktop apps\n\n'
          text += 'The desktop downloads bundle the exact PyPI 0.4.1 scientific editor and a private Python runtime. No Python installation is required. Command shortcuts on macOS and Ctrl shortcuts on Windows include native New/Close document, Save and Save As. The browser GUI and Jupyter remain supported.\n\n'
          text += 'Choose `mac-arm64` for Apple silicon, `mac-x64` for Intel Macs, or `win-x64` for Windows. These builds are not notarized or publisher-signed; see the [desktop installation guide](https://v-ase.readthedocs.io/en/latest/desktop.html) for OS prompts and requirements.\n\n'
          text += f'Desktop source: `{os.environ["GITHUB_SHA"]}`. Every platform passed native file, document, rendering and packaged-runtime checks before upload. `desktop-SHA256SUMS.txt` covers these assets; the attached desktop source archive is their corresponding source.\n'
          notes.write_text(text)
          PY
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file desktop-release-notes.md
