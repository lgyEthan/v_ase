name: Build and verify desktop apps

on:
  push:
    branches: [main]
    paths: ["desktop/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: mac-arm64
          - runner: macos-15-intel
            platform: mac-x64
            software_gl: '1'
          - runner: windows-2022
            platform: win-x64
            software_gl: '1'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      V_ASE_SOFTWARE_GL: ${{ matrix.software_gl || '0' }}
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare static OpenSSL for Intel Mac
        if: matrix.platform == 'mac-x64'
        run: |
          brew install openssl@3
          rustc --version
      - name: Prepare the verified scientific Python runtime
        run: python scripts/prepare_runtime.py
      - run: npm ci
      - name: Prepare the relocatable Mac graphics loader
        if: runner.os == 'macOS'
        run: python scripts/prepare_macos_graphics.py
      - name: Check native file permissions and atomic saves
        run: npm test
      - name: Exercise the desktop GUI and native commands
        run: npm run smoke
      - name: Build the installer and portable archive
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - name: Test the packaged application and relocated Python
        run: python scripts/test_packaged.py
      - name: Verify Windows install and uninstall file associations
        if: runner.os == 'Windows'
        run: python scripts/test_windows_associations.py
      - name: Keep test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-checks-${{ matrix.platform }}
          path: desktop/smoke-output/
          retention-days: 14
      - name: Stage desktop downloads
        uses: actions/upload-artifact@v4
        with:
          name: desktop-release-${{ matrix.platform }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
          if-no-files-found: error

  # Public promotion is deliberately separate from CI. These unsigned/ad-hoc
  # candidates must never overwrite Developer ID signed and notarized releases.
  # After all three targets pass, follow desktop/README.md#sign-and-notarize-macos.
