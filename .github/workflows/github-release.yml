name: Publish GitHub Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: github-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      contains(github.event.head_commit.message, '[bootstrap-github-release]')
    runs-on: ubuntu-latest
    steps:
      - name: Check out the published source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Resolve and verify the release tag
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib

          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"
          TAG="v${VERSION}"
          git rev-parse --verify "refs/tags/${TAG}^{commit}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download the exact PyPI distributions
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          version = os.environ["VERSION"]
          endpoint = f"https://pypi.org/pypi/v-ase-gui/{version}/json"
          with urlopen(endpoint, timeout=60) as response:
              payload = json.load(response)

          output = Path("release-assets")
          output.mkdir()
          selected = [
              item for item in payload.get("urls", [])
              if item.get("packagetype") in {"bdist_wheel", "sdist"}
          ]
          if {item.get("packagetype") for item in selected} != {"bdist_wheel", "sdist"}:
              raise SystemExit("PyPI does not expose both wheel and sdist")

          for item in selected:
              with urlopen(item["url"], timeout=120) as response:
                  data = response.read()
              digest = hashlib.sha256(data).hexdigest()
              if digest != item["digests"]["sha256"]:
                  raise SystemExit(f"Artifact digest mismatch for {item['filename']}")
              (output / item["filename"]).write_bytes(data)
          PY

      - name: Prepare release notes
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ["VERSION"]
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          match = re.search(
              rf"^## {re.escape(version)}\s*$\n(.*?)(?=^## |\Z)",
              changelog,
              flags=re.MULTILINE | re.DOTALL,
          )
          if match is None:
              raise SystemExit(f"CHANGELOG.md has no {version} section")
          notes = match.group(1).strip()
          notes += (
              "\n\nThe attached wheel and source distribution are the same "
              "files published on PyPI.\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release edit "${TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "v_ase ${VERSION}" \
              --notes-file release-notes.md
            echo "GitHub Release ${TAG} notes were updated."
            exit 0
          fi
          gh release create "${TAG}" release-assets/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "v_ase ${VERSION}" \
            --notes-file release-notes.md \
            --verify-tag
