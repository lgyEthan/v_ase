<svg xmlns="http://www.w3.org/2000/svg" width="920" height="294" viewBox="0 0 920 294" role="img" aria-labelledby="title desc">
<title id="title">Private ChatGPT connection to local v_ase</title>
<desc id="desc">ChatGPT connects through OpenAI Secure MCP Tunnel to a local MCP adapter. The adapter and the user's GUI share one atomic document. Python and scientific packages run on the user's computer.</desc>
