<!doctype html>
<html lang="en" data-v-ase-mode="view-only">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src blob:">
  <title>Interactive v_ase example</title>
  <link rel="stylesheet" href="./runtime/standalone.css">
  <style>
    .demo-mode-switch {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 30;
      display: flex;
      gap: 4px;
      padding: 4px;
      border: 1px solid rgba(225, 234, 230, .2);
      border-radius: 6px;
      background: rgba(15, 20, 21, .9);
      backdrop-filter: blur(12px);
    }
    .demo-mode-switch button {
      min-height: 32px;
      padding: 0 10px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: #dce5e3;
      cursor: pointer;
      font: 600 12px/1 system-ui, sans-serif;
    }
    .demo-mode-switch button[aria-pressed="true"] {
      border-color: rgba(88, 213, 189, .6);
      background: rgba(88, 213, 189, .16);
      color: #e7fff9;
    }
    #reference-image {
      position: absolute;
      inset: 0;
      z-index: 25;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #fff;
    }
    #interaction-hint {
      position: absolute;
      right: 12px;
      bottom: 12px;
      z-index: 22;
      padding: 6px 9px;
      border-radius: 4px;
      background: rgba(15, 20, 21, .82);
      color: #e5eeec;
      font: 500 11px/1.3 system-ui, sans-serif;
      pointer-events: none;
    }
    #boot-error {
      position: absolute;
      inset: 16px;
      z-index: 50;
      padding: 16px;
      overflow: auto;
      border: 1px solid #ba4c4c;
      background: #fff4f4;
      color: #711;
      font: 14px/1.5 system-ui, sans-serif;
    }
    @media (max-width: 620px) {
      .document-title,
      .view-only-badge,
      #show-metadata { display: none; }
      #interaction-hint { display: none; }
    }
  </style>
  <script type="importmap">
    {"imports":{"three":"./runtime/vendor/three.module.js"}}
  </script>
</head>
<body>
  <main id="standalone-app" style="--v-ase-export-bg:#ffffff">
    <section class="viewer-stage">
      <div id="viewer-frame" style="width:100%;height:100%">
        <img id="standalone-poster" alt="Saved v_ase structure view" hidden>
      </div>
      <nav class="demo-mode-switch" aria-label="Example view">
        <button id="show-live" type="button" aria-pressed="true">Live 3D</button>
        <button id="show-reference" type="button" aria-pressed="false">Exact capture</button>
      </nav>
      <nav class="viewer-toolbar" aria-label="View-only controls">
        <span id="document-title" class="document-title">v_ase example</span>
        <span class="view-only-badge">INTERACTIVE</span>
        <button id="reset-view" class="icon-button" type="button" title="Reset saved view" aria-label="Reset saved view">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.35-5.65L4 8.7"></path><path d="M4 4v4.7h4.7"></path></svg>
        </button>
        <button id="show-metadata" class="icon-button" type="button" title="Document metadata" aria-label="Document metadata">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 10.7v6M12 7.2h.01"></path></svg>
        </button>
        <button id="download-project" class="text-button" type="button" hidden><span>Download .vase</span></button>
      </nav>
      <aside id="metadata-popover" class="metadata-popover" hidden><h2>Embedded document</h2><dl class="metadata-grid"></dl></aside>
      <div id="timeline" class="timeline" hidden>
        <button id="previous-frame" type="button" aria-label="Previous frame">‹</button>
        <button id="play-frame" type="button" aria-label="Play trajectory">▶</button>
        <button id="next-frame" type="button" aria-label="Next frame">›</button>
        <span id="frame-label" class="frame-label">1 / 1</span>
        <input id="frame-slider" type="range" min="0" max="0" value="0" aria-label="Trajectory frame">
        <label class="fps-label">FPS <input id="playback-fps" type="number" value="12" min="1" max="60"></label>
      </div>
      <img id="reference-image" alt="Exact captured reference" hidden>
      <div id="interaction-hint">Drag to rotate · Shift-drag to pan · wheel to zoom</div>
      <div id="boot-error" hidden></div>
    </section>
  </main>
  <script type="module">
    import { startStandaloneViewer } from './runtime/standalone.js';

    const fail = error => {
      const panel = document.getElementById('boot-error');
      panel.hidden = false;
      panel.textContent = `This v_ase example could not start: ${error?.message || error}`;
      console.error(error);
    };
    try {
      const sceneId = new URLSearchParams(location.search).get('scene') || '';
      if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(sceneId)) throw new Error('Invalid scene id.');
      const response = await fetch(`./scenes/${sceneId}.json`, { credentials: 'same-origin' });
      if (!response.ok) throw new Error(`Scene ${sceneId} returned HTTP ${response.status}.`);
      const scene = await response.json();
      startStandaloneViewer(scene, '');

      const reference = document.getElementById('reference-image');
      const liveButton = document.getElementById('show-live');
      const referenceButton = document.getElementById('show-reference');
      const poster = String(scene.referenceImage || '').trim();
      referenceButton.hidden = !poster;
      if (poster) reference.src = `./posters/${encodeURIComponent(poster)}`;

      const showReference = enabled => {
        reference.hidden = !enabled || !poster;
        liveButton.setAttribute('aria-pressed', String(!enabled));
        referenceButton.setAttribute('aria-pressed', String(enabled));
        document.documentElement.dataset.vAseDemoMode = enabled ? 'reference' : 'live';
      };
      liveButton.addEventListener('click', () => showReference(false));
      referenceButton.addEventListener('click', () => showReference(true));
      showReference(scene.preferReference === true && Boolean(poster));
      document.documentElement.dataset.vAseDemoReady = 'true';
    } catch (error) {
      fail(error);
    }
  </script>
</body>
</html>
