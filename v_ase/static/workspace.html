<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>v_ase</title>
    <script>
        (() => {
            const key = 'v_ase_ui_theme';
            const media = window.matchMedia('(prefers-color-scheme: dark)');
            const normalize = value => ['light', 'dark'].includes(String(value || '').toLowerCase())
                ? String(value).toLowerCase()
                : 'system';
            const cookieValue = () => {
                const match = document.cookie.match(new RegExp(`(?:^|;\\s*)${key}=([^;]+)`));
                return match ? decodeURIComponent(match[1]) : '';
            };
            let localValue = '';
            try { localValue = window.localStorage.getItem(key) || ''; } catch {}
            const persistedValue = cookieValue() || localValue;
            let hasPersisted = Boolean(persistedValue);
            let preference = normalize(persistedValue);
            const apply = (value, { persist = true, announce = true } = {}) => {
                preference = normalize(value);
                const resolved = preference === 'system' ? (media.matches ? 'dark' : 'light') : preference;
                document.documentElement.dataset.uiTheme = resolved;
                document.documentElement.dataset.themePreference = preference;
                document.documentElement.style.colorScheme = resolved;
                if (persist) {
                    hasPersisted = true;
                    document.cookie = `${key}=${encodeURIComponent(preference)}; Path=/; Max-Age=31536000; SameSite=Lax`;
                    try { window.localStorage.setItem(key, preference); } catch {}
                }
                if (announce) {
                    window.dispatchEvent(new CustomEvent('v_ase-theme-change', {
                        detail: { preference, resolved }
                    }));
                }
                return { preference, resolved };
            };
            window.v_aseTheme = {
                apply,
                info: () => ({
                    preference,
                    resolved: document.documentElement.dataset.uiTheme,
                    persisted: hasPersisted
                })
            };
            apply(preference, { persist: false, announce: false });
            media.addEventListener?.('change', () => {
                if (preference === 'system') apply('system', { persist: false });
            });
        })();
    </script>
    <link rel="icon" type="image/png" href="/static/v_ase-logo.png">
    <link rel="stylesheet" href="/static/workspace.css?v=0.2.11">
</head>
<body>
    <header id="document-bar" class="document-bar">
        <div id="document-tabs" class="document-tabs" role="tablist" aria-label="Open structures">
            <button id="new-document" class="new-document" type="button"
                    aria-label="New structure tab" title="New structure tab">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
            </button>
        </div>
    </header>
    <main id="document-panes" class="document-panes"></main>
    <section id="workspace-error" class="workspace-error" hidden>
        <strong>Workspace unavailable</strong>
        <span id="workspace-error-message"></span>
    </section>
    <script type="module" src="/static/workspace.js?v=0.2.11"></script>
</body>
</html>
