<!DOCTYPE html>
<html lang="en" data-v-ase-mode="view-only" data-viewer-theme="dark" data-theme-preference="{{UI_APPEARANCE}}" data-ui-palette="{{UI_PALETTE}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="v_ase-version" content="{{V_ASE_VERSION}}">
    <meta name="v_ase-project-schema" content="v_ase.project.v1">
    <meta name="v_ase-html-schema" content="v_ase.html-view.v1">
    <meta name="robots" content="noindex">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'none'; script-src 'unsafe-inline' blob:; style-src 'unsafe-inline'; img-src data: blob:; connect-src 'none'; worker-src blob:">
    <title>{{DOCUMENT_TITLE}} - v_ase</title>
    <script>{{UI_THEME_SCRIPT}}</script>
    <style>{{STANDALONE_CSS}}</style>
</head>
<body class="standalone-shell">
    <main id="standalone-app" style="--v-ase-export-bg:{{EXPORT_BACKGROUND}}">
        <section class="viewer-stage">
            <div id="viewer-frame" style="{{VIEWER_FRAME_STYLE}}">
                <img id="standalone-poster"
                     src="{{POSTER_DATA_URL}}"
                     alt="Saved v_ase structure view"
                     {{POSTER_HIDDEN}}>
            </div>
            <nav class="viewer-toolbar" aria-label="View-only controls">
                <span id="document-title" class="document-title">{{DOCUMENT_TITLE}}</span>
                <span class="view-only-badge">VIEW ONLY</span>
                <button id="reset-view" class="icon-button" type="button" title="Reset saved view" aria-label="Reset saved view">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M4 12a8 8 0 1 0 2.35-5.65L4 8.7"></path>
                        <path d="M4 4v4.7h4.7"></path>
                    </svg>
                </button>
                <button id="show-metadata" class="icon-button" type="button" title="Document metadata" aria-label="Document metadata" aria-expanded="false" aria-controls="metadata-popover">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="12" cy="12" r="9"></circle>
                        <path d="M12 10.7v6M12 7.2h.01"></path>
                    </svg>
                </button>
                <button id="download-project" class="text-button" type="button" title="Extract the embedded editable .vase project" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M12 3v12M7.5 10.5 12 15l4.5-4.5"></path>
                        <path d="M4 19h16"></path>
                    </svg>
                    <span id="download-project-label">Download .vase</span>
                </button>
            </nav>
            <aside id="metadata-popover" class="metadata-popover" hidden>
                <h2>Embedded document</h2>
                <dl class="metadata-grid"></dl>
            </aside>
            <div id="timeline" class="timeline" hidden>
                <button id="previous-frame" type="button" aria-label="Previous frame">‹</button>
                <button id="play-frame" type="button" aria-label="Play trajectory">▶</button>
                <button id="next-frame" type="button" aria-label="Next frame">›</button>
                <span id="frame-label" class="frame-label">1 / 1</span>
                <input id="frame-slider" type="range" min="0" max="0" value="0" aria-label="Trajectory frame">
                <label class="fps-label">FPS <input id="playback-fps" type="number" value="12" min="1" max="60"></label>
            </div>
            <div id="boot-error" hidden></div>
        </section>
    </main>

    <script id="v-ase-scene-data" type="application/vnd.v-ase.view+json" data-encoding="base64">{{SCENE_DATA_BASE64}}</script>
    <script id="v-ase-project-data" type="application/vnd.v-ase.project+zip" data-encoding="base64">{{PROJECT_DATA_BASE64}}</script>
    {{OFFLINE_PAYLOADS}}
    <!-- pako gzip fallback
    {{GZIP_FALLBACK_LICENSE}}
    -->
    <script type="module">
        const encoded = id => document.getElementById(id)?.textContent.trim() || '';
        const decodeBytes = value => {
            const binary = atob(value);
            const bytes = new Uint8Array(binary.length);
            for (let index = 0; index < binary.length; index++) bytes[index] = binary.charCodeAt(index);
            return bytes;
        };
        const readText = bytes => new TextDecoder('utf-8', { fatal: true }).decode(bytes);
        const moduleUrl = source => URL.createObjectURL(new Blob([source], { type: 'text/javascript' }));
        let fallback;
        const inflateFallback = () => {
            if (!fallback) {
                const url = moduleUrl(readText(decodeBytes(encoded('v-ase-gzip-fallback'))));
                fallback = import(url).finally(() => URL.revokeObjectURL(url));
            }
            return fallback;
        };
        const ungzip = async (bytes, length) => {
            const output = new Uint8Array(length);
            let offset = 0;
            const append = chunk => {
                if (chunk.length > length - offset) throw new Error('Embedded payload exceeds its recorded size.');
                output.set(chunk, offset);
                offset += chunk.length;
            };
            if (typeof DecompressionStream === 'function' && typeof Blob.prototype.stream === 'function') {
                const reader = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip')).getReader();
                try {
                    for (;;) {
                        const { value, done } = await reader.read();
                        if (done) break;
                        append(value);
                    }
                } catch (error) {
                    await reader.cancel().catch(() => {});
                    throw error;
                } finally {
                    reader.releaseLock();
                }
            } else {
                const { Inflate } = await inflateFallback();
                const inflater = new Inflate({ windowBits: 31 });
                inflater.onData = append;
                if (!inflater.push(bytes, true) || !inflater.ended || inflater.err) {
                    throw new Error('Embedded gzip payload is incomplete or invalid.');
                }
            }
            if (offset !== length) throw new Error('Embedded payload does not match its recorded size.');
            return output;
        };
        const unpack = async id => {
            const element = document.getElementById(id);
            if (!element) return '';
            const length = Number(element.dataset.bytes);
            if (!Number.isSafeInteger(length) || length < 0) throw new Error(`Invalid length for ${id}.`);
            const bytes = decodeBytes(element.textContent.trim());
            if (element.dataset.encoding === 'base64+gzip') return readText(await ungzip(bytes, length));
            if (element.dataset.encoding === 'base64' && bytes.length === length) return readText(bytes);
            throw new Error(`Invalid embedded data for ${id}.`);
        };
        const loadPlotly = async () => {
            const script = document.createElement('script');
            script.src = moduleUrl(await unpack('v-ase-plotly-source'));
            try {
                await new Promise((resolve, reject) => {
                    script.onload = resolve;
                    script.onerror = () => reject(new Error('The embedded distribution renderer could not start.'));
                    document.head.append(script);
                });
            } finally {
                URL.revokeObjectURL(script.src);
            }
        };
        try {
            const [three, bsp, grid, waterGeometry, waterLayer, refinement, quality, renderer, energy, distribution, viewer] =
                await Promise.all(['three-source', 'bsp-source', 'grid-source', 'water-geometry', 'water-layer',
                    'surface-refinement', 'render-quality', 'renderer-source', 'energy-source', 'distribution-source',
                    'viewer-source'].map(id => unpack(`v-ase-${id}`)));
            const threeUrl = moduleUrl(three);
            const bspUrl = moduleUrl(bsp);
            const gridUrl = moduleUrl(grid.replace(/from\s+['"]three['"]/, `from '${threeUrl}'`));
            const waterGeometryUrl = moduleUrl(waterGeometry);
            const waterLayerUrl = moduleUrl(waterLayer.replace(/from\s+['"]three['"]/, `from '${threeUrl}'`).replace(/from\s+['"]\.\/water_geometry\.js['"]/, `from '${waterGeometryUrl}'`));
            const refinementUrl = moduleUrl(refinement);
            const qualityUrl = moduleUrl(quality.replace(/from\s+['"]three['"]/, `from '${threeUrl}'`).replace(/from\s+['"]\.\/surface_refinement\.js['"]/, `from '${refinementUrl}'`));
            const rendererSource = renderer.replace(
                /from\s+['"]three['"]/,
                `from '${threeUrl}'`
            ).replace(/from\s+['"]\.\/polyhedra_bsp\.js['"]/, `from '${bspUrl}'`)
                .replace(/from\s+['"]\.\/viewport_grid\.js(?:\?[^'"]*)?['"]/, `from '${gridUrl}'`).replace(/from\s+['"]\.\/water_layer\.js['"]/, `from '${waterLayerUrl}'`).replace(/from\s+['"]\.\/render_quality\.js['"]/, `from '${qualityUrl}'`);
            const rendererUrl = moduleUrl(rendererSource);
            const energyUrl = moduleUrl(energy);
            const distributionUrl = moduleUrl(distribution);
            const viewerSource = viewer
                .replace(/from\s+['"]three['"]/, `from '${threeUrl}'`)
                .replace(/from\s+['"]\.\/trajectory_energy\.js['"]/, `from '${energyUrl}'`)
                .replace(/from\s+['"]\.\/distribution_plot\.js['"]/, `from '${distributionUrl}'`)
                .replace(/from\s+['"]\.\/renderer\.js['"]/, `from '${rendererUrl}'`);
            const viewerUrl = moduleUrl(viewerSource);
            const scene = JSON.parse(readText(decodeBytes(encoded('v-ase-scene-data'))));
            let rdfFrames = [];
            if (scene.exportProfile?.rdfGraph) {
                try {
                    const [packedFrames] = await Promise.all([unpack('v-ase-rdf-frames'), loadPlotly()]);
                    if (packedFrames) {
                        rdfFrames = JSON.parse(packedFrames);
                        if (!Array.isArray(rdfFrames) || rdfFrames.length !== scene.frames.length) {
                            throw new Error('Distribution data does not match the trajectory.');
                        }
                    }
                } catch (error) {
                    delete scene.exportProfile.rdfGraph;
                    const panel = document.getElementById('boot-error');
                    panel.textContent = 'The saved distribution could not be loaded.';
                    panel.hidden = false;
                    console.warn('The saved distribution could not be loaded.', error);
                }
            }
            const module = await import(viewerUrl);
            module.startStandaloneViewer(scene, encoded('v-ase-project-data'), rdfFrames);
        } catch (error) {
            const panel = document.getElementById('boot-error');
            panel.hidden = false;
            panel.textContent = `This v_ase HTML view could not start: ${error?.message || error}`;
            console.error(error);
        }
    </script>
</body>
</html>
